<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Email Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📚 Class Email Manager</h1>
    <p>Create a Google Sheet with enrolled students</p>

    <label>Class Name</label>
    <input id="className" placeholder="Math 101" />

    <label>Email List (one per line)</label>
    <textarea id="emails" placeholder="student1@email.com"></textarea>

    <button id="submit">Create Sheet</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyWxSMuApc6JfBBmNk7HVgMCy6Yo0ukW7t5U6pjynJG4NVgXYQrf8dt5HZn3zOdUlPd9A/exec";

    const btn = document.getElementById("submit");
    const msg = document.getElementById("message");

    btn.onclick = async () => {
      msg.style.display = "none";

      const className = document.getElementById("className").value.trim();
      const emails = document
        .getElementById("emails")
        .value
        .split("\n")
        .map(e => e.trim())
        .filter(Boolean);

      if (!className || emails.length === 0) {
        show("Please enter class name and at least one email.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ className, emails })
        });

        const data = await res.json();

        if (data.success) {
          show(
            `✅ Sheet created! 
             <br><a href="${data.url}" target="_blank">Open Sheet</a>`,
            "success"
          );
          document.getElementById("className").value = "";
          document.getElementById("emails").value = "";
        } else {
          show(data.error, "error");
        }
      } catch (err) {
        show("Network error: " + err.message, "error");
      }

      btn.disabled = false;
      btn.textContent = "Create Sheet";
    };

    function show(text, type) {
      msg.innerHTML = text;
      msg.className = `message ${type}`;
      msg.style.display = "block";
    }
  </script>
</body>
</html>
